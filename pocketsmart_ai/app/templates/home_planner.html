{% extends 'base.html' %}{% block title %}Home Planner{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">HOME INTERIOR</p><h1>Build a home plan within budget</h1></div></div><div class="form-card"><form id="home-form"><div class="form-grid"><label>Budget (INR)<input name="budget" type="number" min="1" required></label><label>Style<select name="style"><option>modern</option><option>minimal</option><option>traditional</option><option>bohemian</option><option>industrial</option></select></label></div><label>Rooms (comma separated)<input name="rooms" placeholder="Living Room, Bedroom, Kitchen"></label><label>Quantities JSON<input name="quantities" placeholder='{"lights":4,"fans":2,"tables":1}'></label><label>Notes<textarea name="notes" placeholder="Colors, space constraints, must-have items..."></textarea></label><button class="btn">Generate home recommendations</button><p id="form-message" class="message"></p></form></div><div id="results" class="results"></div>{% endblock %}{% block scripts %}<script>bindPlanner('home-form','/api/generate-home')</script>{% endblock %}
