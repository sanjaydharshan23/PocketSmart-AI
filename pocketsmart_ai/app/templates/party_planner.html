{% extends 'base.html' %}{% block title %}Party Planner{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">EVENT PLANNING</p><h1>Plan a party without guesswork</h1></div></div><div class="form-card"><form id="party-form"><div class="form-grid"><label>Budget (INR)<input name="budget" type="number" min="1" required></label><label>Guests<input name="guests" type="number" min="1" required></label><label>Event type<select name="event_type"><option>birthday</option><option>wedding</option><option>corporate</option><option>anniversary</option><option>baby shower</option></select></label><label>City<input name="city" placeholder="Delhi"></label></div><label>Venue details<input name="venue" placeholder="Home, banquet hall, hotel, open lawn..."></label><label>Notes<textarea name="notes"></textarea></label><button class="btn">Generate party plan</button><p id="form-message" class="message"></p></form></div><div id="results" class="results"></div>{% endblock %}{% block scripts %}<script>bindPlanner('party-form','/api/generate-party')</script>{% endblock %}
