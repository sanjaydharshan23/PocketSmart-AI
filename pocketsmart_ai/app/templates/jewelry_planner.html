{% extends 'base.html' %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">JEWELRY STYLING</p><h1>Find jewelry that fits your occasion and budget</h1></div></div><div class="form-card"><form id="jewelry-form" enctype="multipart/form-data"><div class="form-grid"><label>Budget (INR)<input name="budget" type="number" min="1" required></label><label>Occasion<select name="occasion"><option>wedding</option><option>party</option><option>office</option><option>festive</option><option>date night</option></select></label><label>Style<select name="style"><option>elegant</option><option>minimal</option><option>traditional</option><option>statement</option><option>contemporary</option></select></label><label>Outfit image (optional)<input name="outfit_image" type="file" accept="image/*"></label></div><label>Outfit description<textarea name="outfit_description" placeholder="Color, neckline, fabric, pattern..."></textarea></label><label>Notes<textarea name="notes"></textarea></label><button class="btn">Generate jewelry recommendations</button><p id="form-message" class="message"></p></form></div><div id="results" class="results"></div>{% endblock %}{% block scripts %}<script>bindPlanner('jewelry-form','/api/generate-jewelry',true)</script>{% endblock %}
